[project]
name = "munim-mcp"
version = "0.1.0"
description = "Optional MCP server exposing Munim's pure checks (stretch)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "munim-core",
]

[project.scripts]
munim-mcp = "munim_mcp.server:main"


[tool.uv.sources]
munim-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
